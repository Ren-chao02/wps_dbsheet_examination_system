<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WPS 多维表格嵌入 Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: #fff;
      border-bottom: 1px solid #e8e8e8;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .toolbar .sep {
      width: 1px; height: 20px; background: #e8e8e8; margin: 0 4px;
    }
    .toolbar button {
      padding: 5px 10px; border: 1px solid #d9d9d9; border-radius: 4px;
      background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .toolbar button.active { background: #1890ff; color: #fff; border-color: #1890ff; }
    .toolbar button:hover { border-color: #1890ff; }
    .toolbar button.active:hover { background: #40a9ff; }
    .toolbar .label { color: #999; font-size: 12px; }
    .toolbar .url-display {
      color: #666; font-size: 11px; max-width: 400px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .iframe-wrap { flex: 1; overflow: hidden; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
    .loading {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #fafafa; color: #999; font-size: 14px;
    }
    .error {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: #fafafa; gap: 12px;
    }
    .error .msg { font-size: 16px; color: #ff4d4f; }
    .error .hint { font-size: 13px; color: #999; }
  </style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <span class="label">模式:</span>
  <button data-mode="normal">全部显示</button>
  <button data-mode="embed" class="active">embed=1</button>
  <button data-mode="noheader">noheader=1</button>
  <button data-mode="embed_sidebar">embed=1 + sidebar</button>
  <button data-mode="embed_notoolbar">embed=1 + notoolbar=1</button>
  <button data-mode="onlybody">onlybody=1</button>
  <span class="sep"></span>
  <span class="label">自定义:</span>
  <input id="customParams" size="28" placeholder="例: embed=1&sidebar=1" style="font-size:12px;padding:3px 6px;border:1px solid #d9d9d9;border-radius:4px;" />
  <button id="btnCustom">加载</button>
  <span class="sep"></span>
  <span class="url-display" id="currentUrl"></span>
</div>

<div class="iframe-wrap" id="wrap">
  <div class="loading" id="loading">正在加载多维表格...</div>
  <iframe id="wpsFrame" src="" allow="clipboard-read; clipboard-write" style="display:none;"></iframe>
  <div class="error" id="error" style="display:none;">
    <span class="msg">加载失败</span>
    <span class="hint">多维表格可能禁止了 iframe 嵌入，请尝试新窗口打开</span>
    <button style="margin-top:8px;" onclick="window.open(BASE_URL + getCurrentParams(), '_blank')">在新窗口打开</button>
  </div>
</div>

<script>
const BASE_URL = 'https://www.kdocs.cn/l/cuqJOJ0WNPQd';
const iframe = document.getElementById('wpsFrame');
const loading = document.getElementById('loading');
const error = document.getElementById('error');
const currentUrlEl = document.getElementById('currentUrl');

const MODE_PARAMS = {
  normal: '',
  embed: 'embed=1',
  noheader: 'noheader=1',
  embed_sidebar: 'embed=1&show_sidebar=1',
  embed_notoolbar: 'embed=1&notoolbar=1',
  onlybody: 'onlybody=1',
};

function getCurrentParams() {
  const active = document.querySelector('.toolbar button.active');
  if (!active) return '';
  return MODE_PARAMS[active.dataset.mode] || '';
}

function buildUrl(params) {
  if (!params) return BASE_URL;
  return BASE_URL + (BASE_URL.includes('?') ? '&' : '?') + params;
}

function loadMode(mode) {
  // Update toolbar highlight
  document.querySelectorAll('.toolbar button[data-mode]').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-mode="${mode}"]`);
  if (btn) btn.classList.add('active');

  const params = MODE_PARAMS[mode] || '';
  const url = buildUrl(params);
  currentUrlEl.textContent = url;
  loadFrame(url);
}

function loadFrame(url) {
  loading.style.display = 'flex';
  error.style.display = 'none';
  iframe.style.display = 'none';
  iframe.src = url;
}

// Toolbar click handlers
document.querySelectorAll('.toolbar button[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => loadMode(btn.dataset.mode));
});

// Custom params button
document.getElementById('btnCustom').addEventListener('click', () => {
  const params = document.getElementById('customParams').value.trim();
  if (!params) return;
  document.querySelectorAll('.toolbar button[data-mode]').forEach(b => b.classList.remove('active'));
  const url = buildUrl(params);
  currentUrlEl.textContent = url;
  loadFrame(url);
});

// Enter key in custom input
document.getElementById('customParams').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btnCustom').click();
});

// If this page itself is embedded, auto load
if (window !== window.top) {
  document.getElementById('toolbar').style.display = 'none';
}

iframe.addEventListener('load', () => {
  loading.style.display = 'none';
  iframe.style.display = 'block';
});

iframe.addEventListener('error', () => {
  loading.style.display = 'none';
  error.style.display = 'flex';
});

// Timeout
let timeoutTimer;
function resetTimeout() {
  clearTimeout(timeoutTimer);
  timeoutTimer = setTimeout(() => {
    if (iframe.style.display === 'none') {
      loading.style.display = 'none';
      error.style.display = 'flex';
    }
  }, 15000);
}
resetTimeout();
iframe.addEventListener('load', resetTimeout);

// Initial load
loadMode('embed');
</script>

</body>
</html>
