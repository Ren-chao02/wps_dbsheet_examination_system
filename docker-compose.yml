version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exam-postgres
    environment:
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
      POSTGRES_DB: examination_system
    # 仅绑定本地回环，避免数据库暴露到内网/公网（数据只供本机服务访问）
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exam_user -d examination_system']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: exam-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-app
    # 仅绑定本地回环：应用只由 cloudflared（内网穿透）暴露到公网，防止绕过隧道直接触达 3002
    # 默认只绑回环（适合「同机反向代理 / 内网穿透」的部署方式，避免绕过代理直连）。
    # 若要让校园网内的学生直连本机 3002（无反向代理），在 .env 里设 APP_BIND=0.0.0.0。
    ports:
      - '${APP_BIND:-127.0.0.1}:3002:3002'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 上传文件目录持久化（试卷导入等场景）
    # 导出文件目录持久化：export-service 的 outputDir = process.cwd()/exports，
    # 容器内 cwd=/app → /app/exports。不挂卷时容器重启即丢文件，
    # 但 DB 里的导出任务仍指向旧路径 → 下载全部 404
    volumes:
      - app_uploads:/app/packages/server/uploads
      - app_exports:/app/exports

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_exports:
